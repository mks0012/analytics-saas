services:
  redis:
    image: redis:7-alpine
    container_name: redis-buffer
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: services/ingestion-api/Dockerfile
    container_name: ingestion-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: services/ingestion-api/Dockerfile
    container_name: event-worker
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      redis:
        condition: service_healthy
    command: python services/worker/worker.py

  frontend:
    build:
      context: ./frontend
    container_name: analytics-dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend